name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  guard:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check-repo.ps1

  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install the pinned Rust toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --no-self-update
      - name: Protocol crate tests
        run: cargo test --locked --manifest-path crates/ocr-protocol/Cargo.toml
      - name: Sidecar tests (the model-dependent ones are #[ignore])
        run: cargo test --locked --ignore-rust-version --manifest-path crates/ocr-sidecar/Cargo.toml
      - name: Packaging script tests
        run: bun test scripts/ocr-runtime-pack.test.ts

  deny:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.19.6
      - name: Bans, licenses and sources (blocking)
        run: cargo deny --manifest-path crates/ocr-sidecar/Cargo.toml check bans licenses sources
      - name: Advisories (a new advisory must not block an unrelated change; the candidate build blocks on it)
        continue-on-error: true
        run: cargo deny --manifest-path crates/ocr-sidecar/Cargo.toml check advisories
